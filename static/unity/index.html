<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover">
    <title>MTVS-strata-unity</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="unity-shell">
      <div id="unity-container">
        <canvas id="unity-canvas" width=1280 height=720 tabindex="-1"></canvas>
        <div id="unity-loading-bar">
          <div id="unity-loading-title">MTVS Strata</div>
          <div id="unity-progress-track">
            <div id="unity-progress-bar-full"></div>
          </div>
        </div>
        <div id="unity-warning"></div>
      </div>
    </main>
    <button id="unity-fullscreen-button" type="button" aria-label="전체 화면">전체 화면</button>

    <script>
      const canvas = document.querySelector("#unity-canvas");
      const container = document.querySelector("#unity-container");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector("#unity-progress-bar-full");
      const fullscreenButton = document.querySelector("#unity-fullscreen-button");

      function unityShowBanner(message, type) {
        const warningBanner = document.querySelector("#unity-warning");
        const entry = document.createElement("div");
        entry.textContent = message;
        entry.className = type === "error" ? "error" : "warning";
        warningBanner.appendChild(entry);

        if (type !== "error") {
          window.setTimeout(() => entry.remove(), 5000);
        }
      }

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/f47b45529546eed34e6291e876599706.loader.js";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/f60458edd41689ef6dcd069bdc83b519.data.unityweb",
        frameworkUrl: buildUrl + "/adf3106f849c32019b6953a80173eb90.framework.js.unityweb",
        codeUrl: buildUrl + "/c3264b4f4a89b3257a340c65ee73af06.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "MTVS-strata-unity",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      loadingBar.hidden = false;

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = (progress * 100) + "%";
        }).then((unityInstance) => {
          loadingBar.hidden = true;
          fullscreenButton.onclick = () => unityInstance.SetFullscreen(1);
        }).catch((message) => {
          unityShowBanner(String(message), "error");
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
