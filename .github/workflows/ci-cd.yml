name: ci-cd.yml

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  tagging:
    name: 태그 생성
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: 버전 태그 생성
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리스 생성
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

  build-push-image:
    name: Docker 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    needs: tagging
    permissions:
      contents: read
      packages: write
    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Git LFS 파일 확인
        run: |
          git lfs pull
          test -f static/unity/Build/1f099c344cd315af30ffc3f04dd0b3ed.data.unityweb
          test "$(wc -c < static/unity/Build/1f099c344cd315af30ffc3f04dd0b3ed.data.unityweb)" -gt 1000000
          test "$(wc -c < static/unity/Build/ab21016636a7e4b9f88cdc8797bb10bb.framework.js.unityweb)" -gt 1000
          test "$(wc -c < static/unity/Build/f28152507e51f8ef8b3ff9dadd75033d.wasm.unityweb)" -gt 1000000

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 메타데이터 생성
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.tagging.outputs.tag_name }}
            type=raw,value=latest

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
