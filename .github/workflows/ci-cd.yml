name: ci-cd.yml

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  tagging:
    name: 태그 생성
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      tag_name: ${{ steps.tag_version.outputs.new_version }}

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: 버전 태그 생성
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 릴리스 생성
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}

  build-push-image:
    name: Docker 이미지 빌드 및 푸시
    runs-on: ubuntu-latest
    needs: tagging

    permissions:
      contents: read
      packages: write

    steps:
      - name: 저장소 checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Git LFS 파일 다운로드
        run: |
          git lfs install
          git lfs pull

      - name: Unity WebGL 파일 확인
        run: |
          echo "===== Git LFS files ====="
          git lfs ls-files

          echo "===== Unity Build files ====="
          ls -lah static/unity/Build/

          DATA_FILE=$(find static/unity/Build -maxdepth 1 -type f -name "*.data.unityweb" | head -n 1)
          FRAMEWORK_FILE=$(find static/unity/Build -maxdepth 1 -type f -name "*.framework.js.unityweb" | head -n 1)
          WASM_FILE=$(find static/unity/Build -maxdepth 1 -type f -name "*.wasm.unityweb" | head -n 1)

          echo "DATA_FILE=$DATA_FILE"
          echo "FRAMEWORK_FILE=$FRAMEWORK_FILE"
          echo "WASM_FILE=$WASM_FILE"

          if [ -z "$DATA_FILE" ]; then
            echo "ERROR: .data.unityweb 파일이 없습니다."
            exit 1
          fi

          if [ -z "$FRAMEWORK_FILE" ]; then
            echo "ERROR: .framework.js.unityweb 파일이 없습니다."
            exit 1
          fi

          if [ -z "$WASM_FILE" ]; then
            echo "ERROR: .wasm.unityweb 파일이 없습니다."
            exit 1
          fi

          DATA_SIZE=$(wc -c < "$DATA_FILE")
          FRAMEWORK_SIZE=$(wc -c < "$FRAMEWORK_FILE")
          WASM_SIZE=$(wc -c < "$WASM_FILE")

          echo "DATA size: $DATA_SIZE bytes"
          echo "FRAMEWORK size: $FRAMEWORK_SIZE bytes"
          echo "WASM size: $WASM_SIZE bytes"

          if [ "$DATA_SIZE" -le 1000000 ]; then
            echo "ERROR: data.unityweb 파일이 너무 작습니다. LFS pointer 파일일 가능성이 있습니다."
            exit 1
          fi

          if [ "$FRAMEWORK_SIZE" -le 1000 ]; then
            echo "ERROR: framework.js.unityweb 파일이 너무 작습니다. LFS pointer 파일일 가능성이 있습니다."
            exit 1
          fi

          if [ "$WASM_SIZE" -le 1000000 ]; then
            echo "ERROR: wasm.unityweb 파일이 너무 작습니다. LFS pointer 파일일 가능성이 있습니다."
            exit 1
          fi

          echo "Unity WebGL 파일 검증 성공"

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 메타데이터 생성
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.tagging.outputs.tag_name }}
            type=raw,value=latest

      - name: Docker 이미지 빌드 및 푸시
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
  deploy:
    runs-on: self-hosted
    needs: build-push-image
    steps:
      - name: 배포
        run: |
          cd /home/ubuntu
          sudo docker compose down
          sudo docker compose pull
          sudo docker compose up -d